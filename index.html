<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <title>My Blog</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a66c2'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // 저장된 테마를 렌더링 전에 적용해서 화면 깜빡임을 막는다.
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        // 저장소를 쓸 수 없으면 OS 설정을 따른다.
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="#/">My Blog</a>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="다크 모드로 전환">
        <!-- 라이트 테마일 때 보이는 달 아이콘 -->
        <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- 다크 테마일 때 보이는 해 아이콘 -->
        <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </g>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="loading" role="status">불러오는 중…</p>
  </main>
  <script>
    // 파일을 직접 열면(file://) 브라우저가 모듈 스크립트와 fetch를 막는다.
    // 그래서 이 안내만은 모듈이 아닌 일반 스크립트로 보여준다.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<section class="message">' +
        '<h1 class="message-title">로컬 서버로 열어 주세요</h1>' +
        '<p>index.html을 파일로 직접 열면 글을 불러올 수 없어요. ' +
        '이 폴더에서 터미널로 node serve.js 를 실행한 뒤 ' +
        'http://localhost:8000 으로 접속해 주세요.</p>' +
        '</section>';
    }
  </script>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> My Blog</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
