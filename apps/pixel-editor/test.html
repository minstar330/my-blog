<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>콕콕 — 로직 테스트</title>
  <link rel="icon" href="data:,">
  <script>
    // 블로그에서 고른 테마를 렌더링 전에 적용한다(읽기만 함).
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        // 저장소를 쓸 수 없으면 OS 설정을 따른다.
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app test-page">
    <header class="app-header">
      <a class="back-link" href="index.html">← 그림판으로</a>
      <h1 class="app-title">콕콕 로직 테스트</h1>
      <p class="test-summary" id="summary" role="status">테스트를 실행하는 중…</p>
    </header>
    <main>
      <ol class="test-list" id="results"></ol>
    </main>
  </div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('summary').textContent =
        '파일로 직접 열면 모듈을 불러올 수 없어요. 저장소 루트에서 node serve.js 를 실행한 뒤 ' +
        'localhost:8000/apps/pixel-editor/test.html 로 접속해 주세요.';
    }
  </script>
  <script type="module">
    import { runTests } from './editor.test.js';

    const results = runTests();
    const passed = results.filter((r) => r.pass).length;
    const list = document.getElementById('results');

    results.forEach((result) => {
      const item = document.createElement('li');
      item.className = result.pass ? 'test-item test-pass' : 'test-item test-fail';
      item.textContent = (result.pass ? '통과 · ' : '실패 · ') + result.name;
      if (!result.pass) {
        const detail = document.createElement('p');
        detail.className = 'test-message';
        detail.textContent = result.message;
        item.appendChild(detail);
      }
      list.appendChild(item);
    });

    document.getElementById('summary').textContent =
      passed === results.length
        ? '전체 ' + results.length + '개 중 ' + passed + '개 통과'
        : '전체 ' + results.length + '개 중 ' + (results.length - passed) + '개 실패';
  </script>
</body>
</html>
