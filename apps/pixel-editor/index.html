<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="16×16 칸에 점을 찍어 도트 그림을 그리고, 테두리가 흐려지지 않는 PNG로 저장하는 그림판.">
  <title>콕콕 — 16×16 픽셀 아트</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4' shape-rendering='crispEdges'%3E%3Cpath fill='%23e0393e' d='M0 0h1v1H0zM3 0h1v1H3zM0 1h4v2H0zM1 3h2v1H1z'/%3E%3C/svg%3E">
  <script>
    // 블로그에서 고른 테마(localStorage 'theme')를 렌더링 전에 적용해 깜빡임을 막는다.
    // 앱은 이 값을 읽기만 하고 쓰지 않는다.
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        // 저장소를 쓸 수 없으면 OS 설정을 따른다.
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a class="back-link" href="../../">← 블로그로</a>
      <div class="title-row">
        <h1 class="app-title">콕콕</h1>
        <p class="app-subtitle" lang="en">16×16 Pixel Art</p>
      </div>
    </header>

    <main class="app-main">
      <div class="editor" id="editor">
        <div class="canvas-frame">
          <canvas class="canvas" id="canvas" width="256" height="256" tabindex="0"
            role="application" aria-roledescription="그림판" aria-label="16×16 그림판"
            aria-describedby="help"></canvas>
        </div>

        <div class="side">
          <p class="current-color">
            <span class="color-chip" id="color-chip" aria-hidden="true"></span>
            <span id="color-label">현재 색 <strong>검정</strong></span>
          </p>

          <div class="button-grid" role="toolbar" aria-label="도구" id="tools">
            <button class="tool-button" type="button" data-tool="pen" aria-pressed="true" aria-keyshortcuts="B" title="펜 (B)">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20l1.2-4.6L15.6 5a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z M13.5 7.1l3.4 3.4 M4 20l4.6-1.2"/></svg>
              <span>펜</span>
            </button>
            <button class="tool-button" type="button" data-tool="eraser" aria-pressed="false" aria-keyshortcuts="E" title="지우개 (E)">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 19l-4.3-4.3a1.5 1.5 0 0 1 0-2.1l7.6-7.6a1.5 1.5 0 0 1 2.1 0l4.6 4.6a1.5 1.5 0 0 1 0 2.1L12 19z M7.5 10.5l6.5 6.5 M9 19h10"/></svg>
              <span>지우개</span>
            </button>
            <button class="tool-button" type="button" data-tool="fill" aria-pressed="false" aria-keyshortcuts="F" title="채우기 (F)">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11l7-7 8 8-7 7a1.5 1.5 0 0 1-2.1 0L4 13.1a1.5 1.5 0 0 1 0-2.1z M4.5 12h14 M20 15.5c0 0 1.8 2.3 1.8 3.4a1.8 1.8 0 0 1-3.6 0c0-1.1 1.8-3.4 1.8-3.4z"/></svg>
              <span>채우기</span>
            </button>
            <button class="tool-button" type="button" data-tool="picker" aria-pressed="false" aria-keyshortcuts="I" title="스포이트 (I)">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 6.5l3 3 M13 5l6 6 M16 8l-9.5 9.5L4 20l2.5-2.5 M16 8l1.8-1.8a2.1 2.1 0 0 1 3 3L19 11"/></svg>
              <span>스포이트</span>
            </button>
          </div>

          <div class="button-grid" role="toolbar" aria-label="편집" id="actions">
            <button class="tool-button" type="button" id="undo" aria-keyshortcuts="Control+Z Meta+Z" title="되돌리기 (Ctrl+Z)" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
              <span>되돌리기</span>
            </button>
            <button class="tool-button" type="button" id="redo" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y" title="다시 하기 (Ctrl+Shift+Z)" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 14l5-5-5-5 M20 9H10a6 6 0 0 0 0 12h3"/></svg>
              <span>다시 하기</span>
            </button>
            <button class="tool-button" type="button" id="grid-toggle" aria-pressed="true" aria-keyshortcuts="G" title="격자선 (G)">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16v16H4z M9.3 4v16 M14.7 4v16 M4 9.3h16 M4 14.7h16"/></svg>
              <span>격자</span>
            </button>
            <button class="tool-button" type="button" id="clear" title="전체 지우기" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13 M10 11v5 M14 11v5"/></svg>
              <span>전체 지우기</span>
            </button>
          </div>

          <div class="palette" role="group" aria-label="팔레트" id="palette">
            <!-- 기본 색 스와치는 main.js가 palette.js 데이터로 만든다. -->
            <label class="swatch swatch-custom" id="custom-swatch">
              <input class="custom-input" type="color" id="custom-input" value="#ff6f61" aria-label="직접 고르기">
              <span class="custom-badge" aria-hidden="true">
                <svg viewBox="0 0 12 12" focusable="false"><path d="M6 2.5v7 M2.5 6h7"/></svg>
              </span>
            </label>
          </div>

          <button class="button save-button" type="button" id="save-button">PNG로 저장</button>
          <p class="note" id="storage-note" hidden>이 브라우저에서는 자동 저장이 꺼져 있어요.</p>
          <p class="file-notice" id="file-notice" hidden></p>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <p id="help">누르거나 끌어서 칠해요. 키보드: 캔버스에서 방향키로 이동, Space를 누른 채 움직이면 칠하기, Enter로 한 칸.</p>
    </footer>
  </div>

  <dialog class="dialog" id="clear-dialog" aria-labelledby="clear-title" aria-describedby="clear-text">
    <h2 class="dialog-title" id="clear-title">그림을 모두 지울까요?</h2>
    <p class="dialog-text" id="clear-text">되돌리기로 다시 살릴 수 있어요.</p>
    <div class="dialog-actions">
      <button class="button button-secondary" type="button" id="clear-cancel" autofocus>취소</button>
      <button class="button button-danger" type="button" id="clear-confirm">지우기</button>
    </div>
  </dialog>

  <dialog class="dialog" id="save-dialog" aria-labelledby="save-title">
    <h2 class="dialog-title" id="save-title">PNG로 저장</h2>
    <fieldset class="scale-field">
      <legend class="scale-legend">크기</legend>
      <div class="scale-options" id="scale-options">
        <!-- 배율 라디오는 main.js가 png.js의 SCALES로 만든다. -->
      </div>
    </fieldset>
    <div class="preview-box">
      <img class="preview-image" id="preview-image" width="160" height="160" alt="저장될 그림 미리보기">
    </div>
    <p class="dialog-text" id="blank-note" hidden>빈 그림이에요. 투명한 이미지로 저장돼요.</p>
    <p class="dialog-text note">다운로드가 안 되면 이미지를 길게 눌러(PC는 오른쪽 클릭) 저장하세요.</p>
    <div class="dialog-actions">
      <button class="button" type="button" id="download-button">다운로드</button>
      <button class="button button-secondary" type="button" id="save-close">닫기</button>
    </div>
  </dialog>

  <div class="visually-hidden" id="live" aria-live="polite"></div>

  <script>
    // 파일을 직접 열면(file://) 브라우저가 모듈 스크립트를 막는다.
    // 그래서 이 안내만은 모듈이 아닌 일반 스크립트로 보여준다.
    if (location.protocol === 'file:') {
      const notice = document.getElementById('file-notice');
      notice.textContent =
        '로컬 서버로 열어 주세요. 파일을 직접 열면 그림판을 불러올 수 없어요. ' +
        '저장소 루트에서 터미널로 node serve.js 를 실행한 뒤 ' +
        'localhost:8000/apps/pixel-editor/ 로 접속해 주세요.';
      notice.hidden = false;
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
